[claude_model]
format = "[$symbol$model]($style) "
symbol = "🤖 "
style = "bold blue"

[claude_context]
format = "[$gauge $percentage]($style) "
gauge_width = 10

[claude_cost]
format = "[$symbol$cost]($style) "
symbol = "💰 "

[profiles]
claude-code = """
[](color_yellow)\
[$directory\
](bg:color_yellow fg:color_orange)\
[\
$git_branch\
$git_commit\
$git_state\
](fg:color_yellow bg:color_aqua)\
\
[   \
${env_var.CLAUDE_MODEL_NERD} \
${env_var.CLAUDE_CONTEXT} \
${env_var.CLAUDE_COST}\
](fg:color_fg0 bg:color_blue)\
[](color_blue)
"""

[env_var.CLAUDE_MODEL_NERD]
variable = "CLAUDE_MODEL_NERD"
format = "[$env_value]($style)"
style = "bg:color_blue fg:color_fg0"

[env_var.CLAUDE_CONTEXT]
variable = "CLAUDE_CONTEXT"
format = "[$gauge $env_value]($style)"
style = "bg:color_blue fg:color_fg0"
gauge_width = 10


[env_var.CLAUDE_COST]
variable = "CLAUDE_COST"
format = "[💰$env_value]($style)"
style = "bg:color_blue fg:color_fg0"
