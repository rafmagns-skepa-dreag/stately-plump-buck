"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 35
command_timeout = 700


format = """
[\
$sudo\
$os\
$username\
$hostname\
](color_orange)\
\
[$directory\
](bg:color_yellow fg:color_orange)\
\
[$git_branch\
$git_commit\
$git_state\
](fg:color_yellow bg:color_aqua)\
\
[$all\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$python\
$memory_usage\
$env_var\
$cmd_duration\
](fg:color_aqua bg:color_blue)\
\
[](fg:color_blue)\
$fill\
[\
$time\
$localip\
](fg:color_bg1)\
[](fg:color_bg1)\
$line_break\
$jobs\
$status\
$character
"""

continuation_prompt = '[▶▶](bright-white) '

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

claude = "#D97757"
claude_bg = "#282828"

git_branch = "#b16286"
git_status = "#d3869b"
git_bg = "#3c3836"

model = "#458588"
model_bg = "#282828"

context = "#d79921"
context_bg = "#3c3836"

cost = "#689d6a"
cost_bg = "#504945"


[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[username]
show_always = false
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = "[ $user ]($style)"

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
read_only = " \U000f033e"

[git_branch]
symbol = "\uf418 "
style = "bg:color_aqua"
format = "[[ $symbol$branch ](fg:color_fg0 bg:color_aqua)]($style)"

[git_status]
disabled = true
style = "bg:color_aqua"
format = "[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)"

[git_commit]
tag_symbol = " \uf412 "

[c]
disabled = true
symbol = "\ue61e "
style = "bg:color_blue"
format = "[[ $symbol($version) ](fg:color_fg0 bg:color_blue)]($style)"

[cpp]
symbol = "\ue61d "
style = "bg:color_blue"
format = "[[ $symbol($version) ](fg:color_fg0 bg:color_blue)]($style)"

