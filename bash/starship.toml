[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = "[[  $time ](fg:color_fg0 bg:color_bg1)]($style)"

[localip]
disabled = false
ssh_only = false
format = "[@$localipv4](fg:color_fg0 bg:color_bg1)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold fg:color_green)"
error_symbol = "[✗](bold fg:color_red)"
vimcmd_symbol = "[V](bold fg:color_green)"
vimcmd_replace_one_symbol = "[V](bold fg:color_purple)"
vimcmd_replace_symbol = "[V](bold fg:color_purple)"
vimcmd_visual_symbol = "[V](bold fg:color_yellow)"

